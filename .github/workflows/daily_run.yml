name: Daily Shorts Factory

on:
  schedule:
    - cron: '0 12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py --count 2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}

      - name: Commit updated history
        run: |
          git config user.name "shorts-factory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history/ || true
          git diff --cached --quiet || git commit -m "update published history [skip ci]"
          git push || true
